name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]  # publishing a release on GitHub builds + attaches the installer
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Cache FFmpeg download
        uses: actions/cache@v4
        with:
          path: build/bin/ffmpeg.exe
          key: ffmpeg-${{ github.run_id }}
          restore-keys: ffmpeg-

      - name: Build app + installer (includes packaged self-test)
        run: python packaging/build.py

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LCClips-Setup
          path: dist/LCClips-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LCClips-Setup-*.exe
          generate_release_notes: true
