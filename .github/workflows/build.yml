name: Build Windows installer

on:
  push:
    branches: [main]
  release:
    types: [published]  # publishing a release on GitHub builds + attaches the installer
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to replace the installer on (e.g. v0.4.2). Empty = the release matching the app version."
        required: false
        default: ""

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Pick the release to attach to
        id: target
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = python -c "import lcclips; print(lcclips.__version__)"
          $tag = "${{ inputs.release_tag || github.event.release.tag_name }}"
          if (-not $tag) { $tag = "v$ver" }   # Run workflow with the box empty -> release matching the app version
          if ($tag.TrimStart("v") -ne $ver) { Write-Error "Release $tag doesn't match the app version $ver"; exit 1 }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not "${{ inputs.release_tag }}") {
              Write-Host "No release $tag yet - building only."; "tag=" >> $env:GITHUB_OUTPUT; exit 0
            }
            Write-Error "Release $tag not found"; exit 1
          }
          Write-Host "Will attach to release $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build app + installer (includes packaged self-test)
        run: python packaging/build.py

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LCClips-Setup
          path: dist/LCClips-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: steps.target.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          files: |
            dist/LCClips-Setup-*.exe
            dist/LCClips-build.json
