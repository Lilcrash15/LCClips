name: Build Windows installer

on:
  push:
    branches: [main]
  release:
    types: [published]  # publishing a release on GitHub builds + attaches the installer
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Replace the installer on this existing release (e.g. v0.4.2). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write  # needed to publish releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Check version matches the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.event.release.tag_name }}".TrimStart("v")
          $ver = python -c "import lcclips; print(lcclips.__version__)"
          if ($tag -ne $ver) { Write-Error "Release is v$tag but the code is version $ver"; exit 1 }

      - name: Build app + installer (includes packaged self-test)
        run: python packaging/build.py

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LCClips-Setup
          path: dist/LCClips-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: |
            dist/LCClips-Setup-*.exe
            dist/LCClips-build.json
